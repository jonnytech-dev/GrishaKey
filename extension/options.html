<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GrishaKey settings</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="options">
    <div class="brand">Grisha<span>Key</span></div>
    <p class="msg">Enter the address of your GrishaKey server.</p>
    <label for="server">Server address</label>
    <input id="server" type="url" placeholder="http://127.0.0.1:9500">
    <button class="primary" id="save" style="margin-top: 16px;">Save and allow access</button>
    <p class="msg" id="result"></p>
    <hr>
    <label class="check-row">
      <input type="checkbox" id="inline">
      <span>Show GrishaKey in login fields<br>
        <span class="msg" style="padding:0;">Adds a GrishaKey icon to password fields so you can fill logins with a click.
        Your browser will ask for access to all websites. Your logins are never shown to the websites themselves.</span>
      </span>
    </label>
    <p class="msg" id="inline-result"></p>

    <!-- Light / dark switch -->
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch light or dark theme" title="Switch theme"></button>
  </main>

  <!-- Fixed icons for the theme button (cloned by options.js) -->
  <template id="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template>
  <template id="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template>

  <script src="options.js"></script>
</body>
</html>
