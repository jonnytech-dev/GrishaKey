<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="popup">

    <!-- Top bar (signed in, home) -->
    <header class="topbar hidden" id="topbar">
      <div class="brand">Grisha<span>Key</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="open-vaults" type="button" title="Vaults" aria-label="Vaults"></button>
        <div class="avatar" id="avatar"></div>
        <button class="icon-btn" id="logout" title="Sign out" aria-label="Sign out"></button>
      </div>
    </header>

    <!-- Top bar (new login form) -->
    <header class="formbar hidden" id="formbar">
      <button class="icon-btn ghost" id="nl-back" type="button" aria-label="Back"></button>
      <h1 id="formbar-title">New login</h1>
    </header>

    <!-- Shown until a server is set in Settings -->
    <section id="setup" class="center hidden">
      <div class="brand brand-lg">Grisha<span>Key</span></div>
      <p class="subtitle">Connect the extension to your GrishaKey server first.</p>
      <button class="primary" id="open-settings">Open settings</button>
    </section>

    <!-- Sign in -->
    <form id="login" class="center hidden">
      <div class="brand brand-lg">Grisha<span>Key</span></div>
      <p class="subtitle">Sign in to your vault</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Master password</label>
      <div class="field-wrap">
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="icon-btn" id="pw-show" type="button" aria-label="Show password"></button>
      </div>
      <button class="primary" type="submit" style="margin-top: 22px;">Sign in</button>
      <p class="msg error hidden" id="login-error"></p>
    </form>

    <!-- Home: logins for this site -->
    <section id="list" class="hidden">
      <button class="primary new-btn" id="new-login" type="button">+ New login</button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search all logins" autocomplete="off" maxlength="100" aria-label="Search all logins">
      </div>
      <div class="site" id="site"></div>
      <div id="items"></div>
      <p class="msg hidden" id="status"></p>
    </section>

    <!-- New login -->
    <form id="new" class="hidden" autocomplete="off">
      <div id="nl-vault-row">
        <label for="nl-vault" style="margin-top: 0;">Vault</label>
        <select id="nl-vault"></select>
      </div>

      <div id="nv-row" class="new-vault hidden">
        <label for="nv-name">New vault name</label>
        <div class="new-vault-row">
          <input id="nv-name" maxlength="100">
          <button type="button" class="small-primary" id="nv-create">Create vault</button>
        </div>
      </div>

      <label for="nl-title">Title</label>
      <input id="nl-title" required maxlength="200">

      <label for="nl-url">Website</label>
      <input id="nl-url" maxlength="2048" placeholder="https://example.com">

      <label for="nl-username">Username or email</label>
      <input id="nl-username" maxlength="320">

      <label for="nl-password">Password</label>
      <div class="field-wrap">
        <input id="nl-password" type="password" maxlength="1024" autocomplete="new-password">
        <button type="button" class="icon-btn" id="nl-show" aria-label="Show password"></button>
        <button type="button" class="icon-btn" id="nl-gen" aria-label="Generate password" title="Generate a strong password"></button>
      </div>

      <!-- Password generator options (opened with the dice button) -->
      <div id="gen-panel" class="gen-panel hidden">
        <!-- Characters or words (passphrase), same choice as the app's generator page -->
        <div class="gen-mode" role="group" aria-label="Password type">
          <button type="button" class="gen-mode-btn" id="gen-mode-password" aria-pressed="true">Characters</button>
          <button type="button" class="gen-mode-btn" id="gen-mode-passphrase" aria-pressed="false">Words</button>
        </div>
        <div class="gen-preview-row">
          <code id="gen-preview" class="gen-preview"></code>
          <button type="button" class="icon-btn ghost" id="gen-refresh" aria-label="Generate another" title="Generate another"></button>
        </div>

        <!-- Characters options -->
        <div id="gen-password-opts">
          <div class="gen-length">
            <label for="gen-length" style="margin:0;">Length</label>
            <input id="gen-length" type="range" min="8" max="64" value="20">
            <span id="gen-length-value" class="gen-length-value">20</span>
          </div>
          <div class="gen-sets">
            <label class="gen-check"><input type="checkbox" id="gen-upper" checked> A–Z</label>
            <label class="gen-check"><input type="checkbox" id="gen-lower" checked> a–z</label>
            <label class="gen-check"><input type="checkbox" id="gen-digits" checked> 0–9</label>
            <label class="gen-check"><input type="checkbox" id="gen-symbols" checked> !@#</label>
          </div>
        </div>

        <!-- Words options -->
        <div id="gen-passphrase-opts" class="hidden">
          <div class="gen-length">
            <label for="gen-words" style="margin:0;">Words</label>
            <input id="gen-words" type="range" min="3" max="12" value="5">
            <span id="gen-words-value" class="gen-length-value">5</span>
          </div>
          <div class="gen-length">
            <label for="gen-separator" style="margin:0;">Separator</label>
            <select id="gen-separator" class="gen-select">
              <option value="-">Dash ( - )</option>
              <option value=" ">Space</option>
              <option value=".">Period ( . )</option>
              <option value="_">Underscore ( _ )</option>
            </select>
          </div>
          <div class="gen-sets">
            <label class="gen-check"><input type="checkbox" id="gen-capitalize" checked> Capitalize words</label>
            <label class="gen-check"><input type="checkbox" id="gen-number" checked> Add a number</label>
          </div>
        </div>
        <div class="gen-actions">
          <button type="button" class="small-primary" id="gen-use">Use password</button>
        </div>
      </div>

      <label for="nl-notes">Notes</label>
      <textarea id="nl-notes" maxlength="10000" rows="3"></textarea>

      <div class="form-actions">
        <button type="button" class="link" id="nl-cancel">Cancel</button>
        <button class="primary" type="submit" id="nl-submit">Save login</button>
      </div>
      <p class="msg error hidden" id="nl-error"></p>
    </form>

    <!-- Vaults -->
    <section id="vaults" class="hidden">
      <div id="vault-items"></div>
      <p class="msg hidden" id="vaults-status"></p>
    </section>

    <!-- Confirmation toast -->
    <div class="toast hidden" id="toast" role="status">
      <span id="toast-icon"></span>
      <span id="toast-text"></span>
      <button type="button" id="toast-close" aria-label="Dismiss"></button>
    </div>

    <!-- Light / dark switch -->
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch light or dark theme" title="Switch theme"></button>
  </main>

  <!-- Fixed icons (cloned by popup.js; never filled with server data) -->
  <template id="icon-person"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></template>
  <template id="icon-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="12" r="4.5"/><path d="M12 12h10M18 12v3M21 12v2"/></svg></template>
  <template id="icon-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></template>
  <template id="icon-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></template>
  <template id="icon-eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></template>
  <template id="icon-eye-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1"/></svg></template>
  <template id="icon-dice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/></svg></template>
  <template id="icon-check"><svg class="check" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7z"/></svg></template>
  <template id="icon-alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg></template>
  <template id="icon-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></template>
  <template id="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template>
  <template id="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template>
  <template id="icon-refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg></template>
  <template id="icon-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></template>
  <template id="icon-vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8v-1M12 16.2v-1M8.8 12h-1M16.2 12h-1"/></svg></template>
  <template id="icon-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></template>

  <script src="menu.js"></script>
  <script src="popup.js"></script>
</body>
</html>
